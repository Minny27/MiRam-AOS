name: Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: Google Play release status
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
          - halted
          - inProgress

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      storeFile: ${{ runner.temp }}/upload-keystore.jks
      storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
      keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
      PLAY_TRACK: ${{ inputs.track }}
      PLAY_RELEASE_STATUS: ${{ inputs.release_status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$storeFile"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Deploy to Google Play
        run: bundle exec fastlane android deploy

      - name: Upload release bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/app-release.aab
